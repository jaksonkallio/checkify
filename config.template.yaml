# Interpolation syntax:
#   ${env.SOME_VAR_NAME} references a variable name from the OS environment variables.
#   ${var.some_var_name} references a variable defined in the environment's `vars` section.

# Expose prometheus metrics for checks.
# Useful for integration with Grafana and sophisticated metric-based alerting rules.
prometheus:
  port: 2112
  path: /metrics

# Environments define different variable values that are usable in checks.
# Checks are replicated for each environment that they're configured for.
environments:
  - name: prod
    vars:
      base_url: https://api.example.com
      my_api_token: ${env.EXAMPLE_PROD_API_TOKEN}
  - name: stage
    vars:
      base_url: https://api-stage.example.com
      my_api_token: ${env.EXAMPLE_STAGE_API_TOKEN}

# Checks are the actual checks that will be evaluated at the configured intervals.
checks:
  http:
    - name: api-gateway-ping
      environments: [prod, stage]
      endpoint: "${var.base_url}/ping"
      method: GET
      headers:
        Authorization: "Bearer ${var.my_api_token}"
      interval: 30s
      timeout: 5s
      tags: [health, api-gateway]
      response_format: string
      assertion: |
        code == 200 &&
        body == "pong"
  ping:
    - name: google
      environments: [prod]
      host: google.com
      count: 4
      timeout: 5s
      interval: 2m
      tags: [health, external-service]
      assertion: packets_received > 0 && packet_loss_pct < 20.0 && avg_rtt_ms < 2000
